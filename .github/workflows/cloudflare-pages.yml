name: Deploy website to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'runtime-profiles/**'
      - 'case-studies/**'
      - 'docs/**'
      - 'spec/**'
      - 'AGENTS.md'
      - 'AI-INGEST.md'
      - 'MASTER-BLUEPRINT.md'
      - 'SKILL.md'
      - 'SOURCES.md'
      - 'STANDARD-v1.md'
      - 'VERSION'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

env:
  CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'soul-md-blueprint' }}
  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://soul-md-blueprint.pages.dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret'; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install website dependencies
        working-directory: apps/website
        run: npm ci --no-audit --no-fund

      - name: Build website
        working-directory: apps/website
        env:
          PUBLIC_SITE_URL: ${{ env.PUBLIC_SITE_URL }}
        run: npm run build

      - name: Assert Pages advanced-mode worker exists
        run: |
          test -f apps/website/dist/_worker.js
          test -f apps/website/dist/index.html
          test -f apps/website/dist/AGENTS.md
          test -f apps/website/dist/openapi.json

      - name: Deploy production to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/website/dist --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
